[package]
name = "bsp-exynos4412"
version = "0.1.0"
edition = "2024"
description = "BSP for the Exynos 4412 tablet — 4 × Cortex-A9 + 1280×800 LVDS panel (LTN101AL03), mXT1664S touch"

[[bin]]
name = "ferrite-ui"
path = "src/main.rs"

[features]
default = ["perf", "g2d_present", "g2d_render", "gpu_compose", "wifi", "layers"]
# Retained layers (`set(layer, n)` subtrees) on FIMD windows 1-4
# (`lcd_layers.rs`): moves and fades of a layer are register writes.
layers = ["ferrite-core/layers"]
# Main-loop profiler: PMU cycle counter + `ferrite_cli.py perf` report.
perf = ["ferrite-core/perf"]
# The presenter (CPU2) copies the dirty box with the G2D instead of the CPU
# (`lcd.rs`, "G2D present copy"). Off = the NEON copy.
g2d_present = []
# The shadow is drawn uncached and the G2D draws on it: large fills and
# translucent fills, and the renderer's cached sprites of translucent
# shapes and images (`renderer.rs`). Off = CPU drawing into a cached shadow.
g2d_render = []
# The Mali-400 repaints the dirty areas whole (`compose.rs`): boxes, rounded
# corners, gradients and pictures from shaders, other widgets from CPU-drawn
# sprites. Needs g2d_render (the uncached shadow) and the compiled shaders in
# src/compose/shaders.rs; without them, or if its self-test fails, the
# built-in passes draw as before.
gpu_compose = ["g2d_render"]
# BCM4334 WiFi on CPU3 + an HTTP server and a TCP bridge to the USART
# protocol (`net/`). Needs the chip firmware at build time
# (`WIFI_FIRMWARE_DIR`, build.rs) or on CACHE, and FERRITE/WIFI.CFG.
wifi = ["exynos_4412_rs/wifi-net", "dep:embassy-net", "dep:embassy-time", "dep:embassy-sync"]

[dependencies]
ferrite-core = { path = "../../ferrite-core", features = ["external_alloc", "pool_large", "wide_code", "wide_obj", "multi_program", "audio", "fast_vm", "render_cache", "superops"] }
# HAL: its panic handler prints file:line on the UART console and halts. A ferrite
# panic screen (LCD + USART, like the other BSPs) can replace it later: turn
# default features off then.
exynos_4412_rs = { path = "../../vendor/exynos_4412_rs/exynos_4412_rs", features = ["heap", "fat", "embassy"] }
# Tasks (`#[task]`) and `yield_now`; the HAL provides the executor platform.
embassy-executor = "0.10"
embassy-futures = "0.1"
embassy-net = { version = "0.9", features = ["medium-ethernet", "proto-ipv4", "dhcpv4", "dhcpv4-hostname", "tcp"], optional = true }
embassy-time = { version = "0.5", optional = true }
embassy-sync = { version = "0.8", optional = true }
