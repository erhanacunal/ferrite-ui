# Build from this directory: cargo build --release
# (the workspace root's config targets the GD32).
[build]
target = "armv7a-none-eabihf"

# link.x comes from exynos_4412_rs (its build.rs), memory.x from this crate's build.rs.
# Cortex-A9 scheduling + NEON (the startup code enables d16-d31 and the IRQ
# entry saves them, so generated code may use them anywhere).
[target.armv7a-none-eabihf]
rustflags = ["-Clink-arg=-Tlink.x", "-Ctarget-cpu=cortex-a9", "-Ctarget-feature=+neon"]

# Speed over size: the workspace profile is `opt-level = "s"` for the 128 KB
# GD32, but this board has 1 GB of RAM. Profile settings in a config file
# override the manifest's, and this file only applies to builds from here.
[profile.release]
opt-level = 3
