[build]
target = "thumbv7m-none-eabi"
# target = "xtensa-esp32s3-none-elf"

[target.thumbv7m-none-eabi]
rustflags = ["-C", "link-arg=-Tgd32-link.x"]

# ESP32-S3 (epaper) build:
#   cargo +esp build --no-default-features --features epaper \
#         --bin epaper --target xtensa-esp32s3-none-elf --release
# Requires Espressif Rust fork: espup install
[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --chip esp32s3 --flash-mode dio --flash-size 16mb --monitor"
rustflags = [
    "-C", "link-arg=-nostartfiles"
]
