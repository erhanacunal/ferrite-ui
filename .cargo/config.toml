# Default target is the GD32 (nextion). Build it from the workspace root with:
#   cargo build -p bsp-nextion --release
[build]
target = "thumbv7m-none-eabi"

# nextion links against the GD32 script at the repo root (linker CWD = root).
[target.thumbv7m-none-eabi]
rustflags = ["-C", "link-arg=-Tgd32-link.x"]

# ESP32-S3 (epaper) build (Espressif Rust fork — `espup install`):
#   cargo +esp build -p bsp-epaper --target xtensa-esp32s3-none-elf \
#         -Zbuild-std=core,alloc --release
# (or just `.\epaper.ps1`)
[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --chip esp32s3 --flash-mode dio --flash-size 16mb --monitor"
rustflags = [
    "-C", "link-arg=-nostartfiles"
]

[target.'cfg(target_arch = "arm")']
# tdo_y13 (armv5te) build. The linker script is supplied by its build.rs with a
# search path, so it resolves regardless of the linker's working directory.
rustflags = [
    "-C", "relocation-model=static",
    "-C", "panic=abort",
]
